<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" role="img" aria-label="Format Hub mark">
  <!-- Background: rounded square in brand purple (~22% radius of 256 = 56) -->
  <rect width="256" height="256" rx="56" ry="56" fill="#7065ec"/>

  <!-- Braces and code lines (all white, rounded caps) -->
  <g fill="none" stroke="#ffffff" stroke-linecap="round" stroke-linejoin="round">
    <!-- Left brace { -->
    <path
      d="M 90 64 C 82 64 76 70 76 80 L 76 116 C 76 124 70 128 62 128 C 70 128 76 132 76 140 L 76 176 C 76 186 82 192 90 192"
      stroke-width="14"/>

    <!-- Right brace } -->
    <path
      d="M 166 64 C 174 64 180 70 180 80 L 180 116 C 180 124 186 128 194 128 C 186 128 180 132 180 140 L 180 176 C 180 186 174 192 166 192"
      stroke-width="14"/>

    <!-- Three aligned "code" lines, varying lengths -->
    <g stroke-width="10" opacity="0.95">
      <!-- Top line ~60% of inner width -->
      <line x1="105" y1="104" x2="151" y2="104"/>
      <!-- Middle line ~80% of inner width (longest) -->
      <line x1="98"  y1="128" x2="158" y2="128"/>
      <!-- Bottom line ~45% of inner width (shortest) -->
      <line x1="111" y1="152" x2="145" y2="152"/>
    </g>
  </g>
</svg>
